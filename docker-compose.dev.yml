version: '3.8'

# ============================================
# MAF RUNNING COACH - DEVELOPMENT MODE
# ============================================

services:
  # Frontend dev server (Vite hot reload)
  maf-app-dev:
    container_name: maf-app-dev
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - maf_dev_network

  # API dev server (NestJS watch mode)
  maf-api-dev:
    container_name: maf-api-dev
    image: node:20-alpine
    working_dir: /app/api
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/api/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://maf_user:devpassword@postgres-dev:5432/maf
      - REDIS_URL=redis://redis-dev:6379
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-dev-key}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-dev-key}
      - WP_OAUTH_CLIENT_ID=${WP_OAUTH_CLIENT_ID:-dev-client}
      - WP_OAUTH_REDIRECT_URI=http://localhost:3001/auth/callback
      - WP_OAUTH_URL=${WP_OAUTH_URL:-https://maf.run}
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npm run start:dev"
    networks:
      - maf_dev_network

  # PostgreSQL for development
  postgres-dev:
    image: postgres:15-alpine
    container_name: maf-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=maf
      - POSTGRES_USER=maf_user
      - POSTGRES_PASSWORD=devpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maf_user -d maf"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - maf_dev_network

  # Redis for development
  redis-dev:
    image: redis:7-alpine
    container_name: maf-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - maf_dev_network

networks:
  maf_dev_network:
    name: maf_dev_network
    driver: bridge

volumes:
  postgres_dev_data:
    name: maf_postgres_dev_data
    driver: local
