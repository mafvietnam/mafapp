version: '3.8'

# ============================================
# MAF RUNNING COACH - PRODUCTION DEPLOYMENT
# ============================================
# Domain: app.maf.run (Frontend)
# Domain: api.maf.run (NestJS API)
# Tunnel: Cloudflare (e20b0b88-6187-4869-9063-eba523eaea2b)
# Server: Ubuntu 24.04 LTS, 16GB RAM
# ============================================

services:
  # -------------------------------------------------------
  # SERVICE 1: MAF RUNNING COACH FRONTEND
  # -------------------------------------------------------
  maf-app:
    container_name: maf-app
    build:
      context: .
      dockerfile: Dockerfile
    image: maf-app:latest
    restart: unless-stopped

    expose:
      - "80"

    networks:
      maf_network:
        ipv4_address: 172.28.0.10

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    environment:
      - NODE_ENV=production
      - TZ=${TZ:-Asia/Ho_Chi_Minh}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.maf.service=frontend"
      - "com.maf.domain=app.maf.run"

  # -------------------------------------------------------
  # SERVICE 2: POSTGRESQL DATABASE
  # -------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: maf-postgres
    restart: unless-stopped

    expose:
      - "5432"

    networks:
      maf_network:
        ipv4_address: 172.28.0.11

    environment:
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PGDATA=/var/lib/postgresql/data/pgdata
      - TZ=${TZ:-Asia/Ho_Chi_Minh}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/init-db.sql:/docker-entrypoint-initdb.d/init-maf.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    mem_limit: 1g

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.maf.service=database"

  # -------------------------------------------------------
  # SERVICE 3: MAF API (NestJS)
  # -------------------------------------------------------
  maf-api:
    container_name: maf-api
    build:
      context: ./api
      dockerfile: Dockerfile
    image: maf-api:latest
    restart: unless-stopped

    expose:
      - "3001"

    networks:
      maf_network:
        ipv4_address: 172.28.0.14

    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${MAF_DB_USER:-maf_user}:${MAF_DB_PASSWORD:-changeme}@postgres:5432/maf
      - REDIS_URL=redis://redis:6379
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      - WP_OAUTH_CLIENT_ID=${WP_OAUTH_CLIENT_ID:?WP_OAUTH_CLIENT_ID is required}
      - WP_OAUTH_REDIRECT_URI=${WP_OAUTH_REDIRECT_URI:-https://api.maf.run/auth/callback}
      - WP_OAUTH_URL=${WP_OAUTH_URL:-https://maf.run}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://app.maf.run}
      - FEATURE_GARMIN=${FEATURE_GARMIN:-false}
      - GARMIN_ENCRYPTION_KEY=${GARMIN_ENCRYPTION_KEY:-}
      - FEATURE_STRAVA=${FEATURE_STRAVA:-false}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_ENCRYPTION_KEY=${STRAVA_ENCRYPTION_KEY:-}
      - STRAVA_WEBHOOK_VERIFY_TOKEN=${STRAVA_WEBHOOK_VERIFY_TOKEN:-}
      - BACKEND_URL=${BACKEND_URL:-https://api.maf.run}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    mem_limit: 1g

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.maf.service=api"
      - "com.maf.domain=api.maf.run"

  # -------------------------------------------------------
  # SERVICE 4: REDIS (Sessions + Cache)
  # -------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: maf-redis
    restart: unless-stopped

    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

    expose:
      - "6379"

    networks:
      maf_network:
        ipv4_address: 172.28.0.15

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    mem_limit: 512m

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.maf.service=cache"

  # -------------------------------------------------------
  # SERVICE 5: N8N (COMMENTED OUT — removal deferred to Phase 6)
  # -------------------------------------------------------
  # n8n:
  #   image: docker.n8n.io/n8nio/n8n:latest
  #   container_name: maf-n8n
  #   restart: unless-stopped
  #   expose:
  #     - "5678"
  #   networks:
  #     maf_network:
  #       ipv4_address: 172.28.0.12
  #   environment:
  #     - DB_TYPE=postgresdb
  #     - DB_POSTGRESDB_HOST=postgres
  #     - DB_POSTGRESDB_PORT=5432
  #     - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
  #     - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
  #     - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
  #     - N8N_HOST=${N8N_HOST:-api.maf.run}
  #     - N8N_PORT=5678
  #     - N8N_PROTOCOL=https
  #     - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
  #     - NODE_ENV=production
  #   volumes:
  #     - n8n_data:/home/node/.n8n
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  # -------------------------------------------------------
  # SERVICE 6: CLOUDFLARE TUNNEL
  # -------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: maf-cloudflare-tunnel
    restart: unless-stopped

    networks:
      maf_network:
        ipv4_address: 172.28.0.13

    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

    depends_on:
      maf-app:
        condition: service_healthy
      maf-api:
        condition: service_healthy

    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.maf.service=tunnel"
      - "com.maf.tunnel-id=e20b0b88-6187-4869-9063-eba523eaea2b"

# -------------------------------------------------------
# NETWORK CONFIGURATION
# -------------------------------------------------------
networks:
  maf_network:
    name: maf_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

# -------------------------------------------------------
# PERSISTENT VOLUMES
# -------------------------------------------------------
volumes:
  postgres_data:
    name: maf_postgres_data
    driver: local
