# ============================================
# NGINX CONFIGURATION - MAF RUNNING COACH
# Optimized for Performance, Security & Stability
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version for security
    server_tokens off;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=()" always;
    
    # Content Security Policy (Optimized for React + Tailwind)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-ancestors 'self';" always;
    
    # HSTS (uncomment for HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ============================================
    # PERFORMANCE - COMPRESSION
    # ============================================
    
    # Gzip Configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/x-component
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;
    gzip_disable "msie6";

    # ============================================
    # PERFORMANCE - BUFFERS & TIMEOUTS
    # ============================================
    
    # Buffer settings
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    client_max_body_size 2m;
    large_client_header_buffers 4 8k;

    # Timeout settings
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 65s;
    keepalive_requests 100;
    send_timeout 10s;
    reset_timedout_connection on;

    # TCP optimizations
    tcp_nodelay on;
    tcp_nopush on;

    # ============================================
    # CACHING STRATEGY
    # ============================================
    
    # HTML - Short cache (1 hour) for updates
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        etag on;
    }
    
    # Static assets with hash - Long cache (1 year)
    location ~* \.(css|js|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        etag off;
    }
    
    # Images - Long cache
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        etag off;
        
        # Image optimization headers
        add_header Vary "Accept-Encoding";
    }
    
    # Fonts - Long cache with CORS
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        etag off;
    }
    
    # JSON/Data files - Medium cache
    location ~* \.(json|xml)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Manifest and service worker - No cache
    location ~* (manifest\.json|sw\.js|service-worker\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        etag on;
    }

    # ============================================
    # API PROXY — forward /api/* to NestJS backend
    # ============================================

    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://maf-api:3001;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # REACT ROUTER - SPA HANDLING
    # ============================================

    location / {
        # Try to serve file directly, fallback to index.html
        try_files $uri $uri/ /index.html =404;

        # Cache control for SPA entry point
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ============================================
    # SECURITY - DENY ACCESS TO SENSITIVE FILES
    # ============================================
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to backup/config files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============================================
    # HEALTH CHECK ENDPOINT
    # ============================================
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # ERROR PAGES
    # ============================================
    
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # ============================================
    # LOGGING (Using default 'combined' format)
    # ============================================
    
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
